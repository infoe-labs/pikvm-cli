name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      matrix:
        go: ["1.25.x", stable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: python3 scripts/generate-api.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test -race -coverpkg=./cli,./lib/pikvm,./mcpserver -covermode=atomic -coverprofile=coverage.out ./...
      - run: python3 scripts/check-coverage.py coverage.out --summary "$GITHUB_STEP_SUMMARY"
      - run: go test -tags integration ./integration -run '^TestLivePiKVMReadOnly$' -v
      - run: go vet ./...
      - run: go build -o bin/pikvm-cli ./cmd/pikvm-cli
      - run: go build -o bin/pikvm-cli-source main.go
  homebrew:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test this checkout as a Homebrew tap
        run: |
          brew tap infoe-labs/pikvm-cli "$GITHUB_WORKSPACE"
          if grep -q '^  head ' Formula/pikvm-cli.rb; then
            brew install --HEAD infoe-labs/pikvm-cli/pikvm-cli
          else
            brew install infoe-labs/pikvm-cli/pikvm-cli
          fi
          brew test infoe-labs/pikvm-cli/pikvm-cli
          pikvm-cli --help
  build:
    if: always()
    needs: [unit, homebrew]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      UNIT_RESULT: ${{ needs.unit.result }}
      HOMEBREW_RESULT: ${{ needs.homebrew.result }}
    steps:
      - name: Require every test and Homebrew check to pass
        run: |
          test "$UNIT_RESULT" = success
          test "$HOMEBREW_RESULT" = success
