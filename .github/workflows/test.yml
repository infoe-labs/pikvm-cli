name: Build
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Key on the pull request number, not the shared branch ref, so the pull_request run
  # for a branch is never cancelled by an unrelated push run for the same ref.
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  homebrew-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ github.event_name == 'workflow_dispatch' || steps.formula.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect formula changes in the pull request
        if: github.event_name == 'pull_request'
        id: formula
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet --no-renames "$BASE_SHA" "$HEAD_SHA" -- Formula/; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then
              exit "$result"
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  unit:
    strategy:
      matrix:
        go: ["1.25.x", stable]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: python3 scripts/generate-api.py --check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: go test -race -coverpkg=./cli,./lib/pikvm,./mcpserver -covermode=atomic -coverprofile=coverage.out ./...
      - run: python3 scripts/check-coverage.py coverage.out --summary "$GITHUB_STEP_SUMMARY"
      - run: go test -tags integration ./integration -run '^TestLivePiKVMReadOnly$' -v
      - run: go vet ./...
      - run: go build -o bin/pikvm-cli ./cmd/pikvm-cli
      - run: go build -o bin/pikvm-cli-source main.go
  homebrew:
    needs: homebrew-changes
    # Keep native installation checks for formula PRs and explicit manual runs.
    if: needs.homebrew-changes.outputs.required == 'true'
    runs-on: macos-latest
    # macOS runners can queue for a long time and queued time counts against this limit,
    # which previously cancelled the job before its first step ran and failed the aggregate.
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and test this checkout as a Homebrew tap
        run: |
          brew tap infoe-labs/pikvm-cli "$GITHUB_WORKSPACE"
          if grep -q '^  head ' Formula/pikvm-cli.rb; then
            brew install --HEAD infoe-labs/pikvm-cli/pikvm-cli
          else
            brew install infoe-labs/pikvm-cli/pikvm-cli
          fi
          brew test infoe-labs/pikvm-cli/pikvm-cli
          pikvm-cli --help
  build:
    if: always()
    needs: [unit, homebrew-changes, homebrew]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      UNIT_RESULT: ${{ needs.unit.result }}
      CHANGES_RESULT: ${{ needs.homebrew-changes.result }}
      HOMEBREW_REQUIRED: ${{ needs.homebrew-changes.outputs.required }}
      HOMEBREW_RESULT: ${{ needs.homebrew.result }}
    steps:
      - name: Require tests and any requested Homebrew check to pass
        run: |
          test "$UNIT_RESULT" = success
          test "$CHANGES_RESULT" = success
          case "$HOMEBREW_REQUIRED" in
            true) test "$HOMEBREW_RESULT" = success ;;
            false) test "$HOMEBREW_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
